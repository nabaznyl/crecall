[project]
name = "crecall-backend"
version = "0.1.0-dev-7"
description = "crecall Backend API - Session recall and memory management"
requires-python = ">=3.11"
readme = "README.md"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
show_error_codes = true
warn_unreachable = false
warn_unused_ignores = false
warn_redundant_casts = false
exclude = ["tests/", "archive/", "archives/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
	"session_lifecycle: tests for session lifecycle workflow",
	"memory_search: tests for ranked memory search workflow",
	"export_import: tests for export/import workflow",
	"retention_pruning: tests for retention pruning scheduler",
	"crash_snapshot: tests for crash snapshot routine"
]
