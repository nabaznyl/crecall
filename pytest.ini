[pytest]
testpaths = backend/tests
python_files = test_*_async.py test_*.py
norecursedirs = backups build dist .git .venv venv
asyncio_default_fixture_loop_scope = function
markers =
    session_lifecycle: Session status transitions and cache invalidation tests
    memory_search: Ranked memory search and filtering tests
    export_import: Export/import roundtrip and integrity tests
    retention_pruning: Retention scheduler and pruning logic tests
    crash_snapshot: Crash snapshot capture and periodic scheduling tests
    integration: Multi-component integration tests
    unit: Unit tests for individual functions
    portability: Data portability and migration tests
