site_name: crecall Documentation
site_description: Portable personal recall layer for technical workflows
site_author: crecall contributors
site_url: https://nabaznyl.github.io/crecall/
repo_name: nabaznyl/crecall
repo_url: https://github.com/nabaznyl/crecall
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Configuration: CONFIGURATION.md
      - Quick Start: quick-start.md
  - Core Concepts:
      - Data Model: data_model.md
      - Workflows: workflows.md
      - Architecture: architecture.md
  - Development:
      - Setup: DEVELOPMENT.md
      - Quality & Testing: quality.md
      - Contributing: contributing.md
  - Project:
      - Vision: VISION.md
      - Roadmap: ROADMAP.md
      - Build Standards: BUILD_STANDARDS.md
      - Security: SECURITY_PROTOCOLS.md
      - Changelog: changelog.md
  - API Reference:
      - REST API: api/rest.md
      - Data Models: api/models.md

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nabaznyl/crecall

copyright: Copyright &copy; 2025 crecall contributors
