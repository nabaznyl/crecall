name: Code Quality & Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort pylint

    - name: Check code formatting with black
      working-directory: backend
      run: |
        black --check app tests || echo "⚠️  Code formatting issues found (auto-fixable with 'black .')"

    - name: Check import sorting with isort
      working-directory: backend
      run: |
        isort --check-only app tests || echo "⚠️  Import sorting issues found (auto-fixable with 'isort .')"

    - name: Lint with flake8
      working-directory: backend
      run: |
        flake8 app tests --max-line-length=120 --statistics || echo "⚠️  Linting issues found"

    - name: Check with pylint
      working-directory: backend
      continue-on-error: true
      run: |
        pylint app --disable=all --enable=W0611 --max-line-length=150
