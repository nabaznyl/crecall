name: Security Checks

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security checks daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit security check
      run: |
        bandit -r backend/app --skip B101 --format json -o bandit-report.json || true
        bandit -r backend/app --skip B101 || echo "⚠️  Security issues found"

    - name: Check dependencies for known vulnerabilities
      working-directory: backend
      run: |
        pip install -r requirements.txt
        safety check --json || echo "⚠️  Vulnerable dependencies detected"

    - name: SAST with Semgrep (optional)
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/python
        generateSarif: true
      continue-on-error: true
