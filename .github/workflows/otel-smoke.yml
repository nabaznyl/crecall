name: OTEL Instrumentation Smoke Test

on:
  workflow_dispatch: {}
  pull_request:
    branches: [ stable ]

jobs:
  otel-smoke:
    name: OTEL Smoke Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install optional OTEL instrumentation
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-otel.txt ]; then
            python -m pip install -r requirements-otel.txt
          else
            echo "No optional OTEL requirements file found; skipping install"
          fi

      - name: Verify OTEL imports
        run: |
          mkdir -p $GITHUB_WORKSPACE/otel-reports
          python .github/scripts/otel_smoke.py 2>&1 | tee $GITHUB_WORKSPACE/otel-reports/otel-imports-${{ matrix.python-version }}.txt

      - name: Run OTEL integration smoke
        run: |
          python .github/scripts/otel_integration_smoke.py 2>&1 | tee $GITHUB_WORKSPACE/otel-reports/otel-integration-${{ matrix.python-version }}.txt

      - name: Upload OTEL reports
        uses: actions/upload-artifact@v4
        with:
          name: otel-reports-${{ matrix.python-version }}
          path: otel-reports/
