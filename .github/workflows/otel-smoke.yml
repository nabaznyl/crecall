name: OTEL Instrumentation Smoke Test

on:
  workflow_dispatch: {}
  pull_request:
    branches: [ stable ]

jobs:
  otel-import-check:
    name: OTEL Import Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install optional OTEL instrumentation
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements-otel.txt ]; then
            python -m pip install -r backend/requirements-otel.txt
          else
            echo "No optional OTEL requirements file found; skipping install"
          fi

      - name: Verify OTEL imports
        run: |
          mkdir -p $GITHUB_WORKSPACE/otel-reports
          python .github/scripts/otel_smoke.py 2>&1 | tee $GITHUB_WORKSPACE/otel-reports/otel-imports-${{ matrix.python-version }}.txt

      - name: Upload OTEL import report
        uses: actions/upload-artifact@v4
        with:
          name: otel-imports-${{ matrix.python-version }}
          path: otel-reports/otel-imports-${{ matrix.python-version }}.txt

  otel-integration:
    name: OTEL Integration Smoke
    runs-on: ubuntu-latest
    needs: otel-import-check
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies (backend)
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            python -m pip install -r backend/requirements.txt
          else
            echo "No backend/requirements.txt found; installing fastapi as a minimum requirement"
            python -m pip install fastapi
          fi
          if [ -f backend/requirements-otel.txt ]; then
            python -m pip install -r backend/requirements-otel.txt
          fi

      - name: Run OTEL integration smoke
        run: |
          mkdir -p $GITHUB_WORKSPACE/otel-reports
            python .github/scripts/otel_integration_smoke.py 2>&1 | tee $GITHUB_WORKSPACE/otel-reports/otel-integration-${{ matrix.python-version }}.txt

      - name: Upload OTEL integration report
        uses: actions/upload-artifact@v4
        with:
          name: otel-integration-${{ matrix.python-version }}
          path: otel-reports/otel-integration-${{ matrix.python-version }}.txt
