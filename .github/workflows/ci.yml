name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quality:
    name: Quality & Tests (matrix)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install "black==25.11.0" "ruff==0.9.2"
          pip install -r requirements.txt

      - name: Lint - Black
        working-directory: backend
        run: black --check app tests

      - name: Lint - Ruff
        working-directory: backend
        run: ruff check app tests

      - name: Tests with coverage (fail under 80%)
        working-directory: backend
        env:
          CRECALL_TEST_MODE: "1"
          DB_URL: "sqlite+aiosqlite:///./test.db"
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          pytest -v --tb=short --cov=app --cov-report=term --cov-report=xml --cov-fail-under=80

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            backend/coverage.xml

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install security tooling
        run: |
          pip install pip-audit safety

      - name: pip-audit (fail on any vulnerability)
        working-directory: backend
        run: |
          pip-audit -r requirements.txt -f json -o pip-audit.json --strict

      - name: safety (report only)
        working-directory: backend
        run: |
          safety check -r requirements.txt --full-report || true

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-reports
          path: |
            backend/pip-audit.json

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend deps (no dev extras)
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install cyclonedx-bom

      - name: Generate Python SBOM (CycloneDX)
        working-directory: backend
        run: |
          cyclonedx-py requirements -r requirements.txt -o backend-cyclonedx-sbom.json

      - name: Install frontend deps & CycloneDX
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm install --no-save @cyclonedx/cyclonedx-npm

      - name: Generate Node SBOM (CycloneDX)
        working-directory: frontend
        run: |
          npx cyclonedx-npm --output-file frontend-cyclonedx-sbom.json --include-dev

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            backend/backend-cyclonedx-sbom.json
            frontend/frontend-cyclonedx-sbom.json

  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for better scanning
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
          fail: true
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  container-harden:
    name: Container Build & Scan (Trivy)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build production image
        run: |
          docker build -t crecall:ci -f Dockerfile .
      - name: Scan image with Trivy (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: crecall:ci
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
      - name: Export Trivy SBOM (CycloneDX)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: crecall:ci
          format: 'cyclonedx'
          output: 'trivy-image-sbom.json'
      - name: Upload container scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security
          path: trivy-image-sbom.json
        
