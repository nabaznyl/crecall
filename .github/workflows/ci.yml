name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install "black==25.11.0" "ruff==0.9.2"
          pip install -r requirements.txt
      
      - name: Lint - Black
        working-directory: backend
        run: black --check app tests
      
      - name: Lint - Ruff
        working-directory: backend
        run: ruff check app tests
      
      - name: Tests
        working-directory: backend
        env:
          CRECALL_TEST_MODE: "1"
          DB_URL: "sqlite+aiosqlite:///./test.db"
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest -v --tb=short

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install security tooling
        run: |
          pip install pip-audit safety

      - name: pip-audit (fail on any vulnerability)
        working-directory: backend
        run: |
          pip-audit -r requirements.txt -f json -o pip-audit.json --strict

      - name: safety (report only)
        working-directory: backend
        run: |
          safety check -r requirements.txt --full-report || true

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-reports
          path: |
            backend/pip-audit.json

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend deps (no dev extras)
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install cyclonedx-bom

      - name: Generate Python SBOM (CycloneDX)
        working-directory: backend
        run: |
          cyclonedx-py requirements -r requirements.txt -o backend-cyclonedx-sbom.json

      - name: Install frontend deps & CycloneDX
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm install --no-save @cyclonedx/cyclonedx-npm

      - name: Generate Node SBOM (CycloneDX)
        working-directory: frontend
        run: |
          npx cyclonedx-npm --output-file frontend-cyclonedx-sbom.json --include-dev

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            backend/backend-cyclonedx-sbom.json
            frontend/frontend-cyclonedx-sbom.json
        
