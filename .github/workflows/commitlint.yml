name: Commit Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run commitlint
        uses: wagoid/commitlint-github-action@v4
        with:
          configFile: commitlint.config.js
