name: Benchmarks (nightly)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run benchmark helper
        run: |
          chmod +x ./scripts/run_benchmarks.sh
          ./scripts/run_benchmarks.sh --threshold 0.05
      - name: Check benchmark regressions
        working-directory: backend
        env:
          REGRESSION_THRESHOLD: '0.05'
        run: |
          LATEST=$(ls benchmarks/*.json | sort | tail -n1)
          echo "Comparing $LATEST against baseline 'benchmarks/baseline.json' (threshold=${REGRESSION_THRESHOLD})"
          python3 benchmarks/check_regressions.py --baseline benchmarks/baseline.json --current "$LATEST" --threshold ${REGRESSION_THRESHOLD}
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: backend/benchmarks
